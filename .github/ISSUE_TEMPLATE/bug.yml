name: Bug report
description: Report a reproducible problem with Drag 2.0
title: "Bug: "
body:
  - type: input
    id: version
    attributes:
      label: App and macOS versions
      placeholder: Drag 2.0 0.0.1, macOS 26, Apple Silicon
    validations:
      required: true
  - type: input
    id: apps
    attributes:
      label: Source and destination apps
      description: Include browser/app versions if relevant.
  - type: textarea
    id: reproduction
    attributes:
      label: Steps, expected result, actual result
      description: Use synthetic text; do not include private clipboard or document content.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and relevant settings
      description: A short recording helps with gestures. Mention custom shortcut, multiselect, glass, and permission state where relevant.
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and removed private information.
          required: true
