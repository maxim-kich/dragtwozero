<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
<title id="title">DragTwoZero — light appearance</title>
<desc id="desc">Two merging glass tiles with a three-line drag cursor on the smaller lower-right tile. Cursor opacity 92 percent. Editable vector artwork.</desc>
<defs>
 <linearGradient id="base" x1="0" y1="0" x2=".85" y2="1"><stop stop-color="#d5e7f6"/><stop offset=".48" stop-color="#aac5dc"/><stop offset="1" stop-color="#8eaec7"/></linearGradient>
 <linearGradient id="body" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#f4faff" stop-opacity=".64"/><stop offset=".4" stop-color="#d5e7f7" stop-opacity=".24"/><stop offset=".72" stop-color="#86a9c7" stop-opacity=".12"/><stop offset="1" stop-color="#e6d7b8" stop-opacity=".33"/></linearGradient>
 <linearGradient id="rim" x1=".12" y1="0" x2=".85" y2="1"><stop stop-color="#fffefa"/><stop offset=".24" stop-color="#f9fcff" stop-opacity=".86"/><stop offset=".46" stop-color="#e8f4ff" stop-opacity=".25"/><stop offset=".72" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#fff1d7"/></linearGradient>
 <radialGradient id="topGlow" cx=".15" cy=".05" r=".9"><stop stop-color="#fff" stop-opacity=".72"/><stop offset=".35" stop-color="#fff" stop-opacity=".09"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
 <radialGradient id="warmGlow" cx=".9" cy=".94" r=".65"><stop stop-color="#ffe6b4" stop-opacity=".5"/><stop offset=".5" stop-color="#fff0da" stop-opacity=".05"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
 <filter id="shadow" x="-40%" y="-30%" width="180%" height="190%"><feGaussianBlur stdDeviation="28"/></filter>
 <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="12"/></filter>
 <filter id="edge" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
 <path id="glassShape" d="M 270,145 H 500 C 585,145 640,195 640,280 V 330 C 640,375 665,400 710,400 H 755 C 838,400 880,447 880,530 V 695 C 880,780 835,830 750,830 H 580 C 495,830 450,784 450,700 V 690 C 450,650 425,625 385,625 H 270 C 185,625 140,578 140,495 V 280 C 140,195 185,145 270,145 Z"/>
 <clipPath id="glassClip"><use href="#glassShape"/></clipPath>
 <clipPath id="baseClip"><rect x="32" y="32" width="960" height="960" rx="235"/></clipPath>
</defs>
<g id="icon-background">
 <rect x="32" y="32" width="960" height="960" rx="235" fill="url(#base)"/>
 <g clip-path="url(#baseClip)"><path d="M45 250 C45 98 123 42 275 42 H745" fill="none" stroke="#fff" stroke-opacity=".22" stroke-width="7" filter="url(#edge)"/></g>
 <rect x="34" y="34" width="956" height="956" rx="233" fill="none" stroke="#fff" stroke-opacity=".16" stroke-width="2"/>
</g>
<g id="merged-glass">
 <use href="#glassShape" fill="#050d15" opacity=".25" transform="translate(4 34)" filter="url(#shadow)"/>
 <use href="#glassShape" fill="url(#body)"/>
 <g clip-path="url(#glassClip)">
  <use href="#glassShape" fill="url(#topGlow)"/>
  <path d="M195 598 C270 595 330 615 393 600 C443 588 456 555 456 510 C454 433 506 400 574 402 C620 404 661 411 705 407" fill="none" stroke="#101e2b" stroke-opacity=".33" stroke-width="32" filter="url(#soft)"/>
  <path d="M463 712 V530 Q463 410 585 410 H755 Q870 410 870 530" fill="none" stroke="#fff" stroke-opacity=".72" stroke-width="20" filter="url(#soft)"/>
  <path d="M458 698 V534 Q458 405 585 405 H754" fill="none" stroke="#fffdf6" stroke-opacity=".75" stroke-width="5" filter="url(#edge)"/>
  <use href="#glassShape" fill="url(#warmGlow)"/>
  <use href="#glassShape" fill="none" stroke="url(#rim)" stroke-width="35" filter="url(#soft)"/>
  <use href="#glassShape" fill="none" stroke="url(#rim)" stroke-width="12" filter="url(#edge)"/>
 </g>
 <use href="#glassShape" fill="none" stroke="url(#rim)" stroke-width="3.5"/>
 <path d="M602 361 Q631 398 678 402 M420 624 Q448 639 451 680" fill="none" stroke="#fff" stroke-opacity=".65" stroke-width="5" filter="url(#edge)"/>
</g>
<!-- Flat adaptive foreground: light on dark glass, charcoal on light glass. -->
<g id="drag-cursor" transform="translate(593.5 519) scale(8)" opacity=".92" fill="#202e37" stroke="#202e37">
 <path d="M2.5 2 L16 14 L10.5 14.5 L14 21 L10.5 23 L7 16.5 L2.5 20.5 Z" stroke-width="1" stroke-linejoin="round"/>
 <path d="M10 2.5 H17 M14 6.5 H20 M18 10.5 H23" fill="none" stroke-width="2" stroke-linecap="round"/>
</g>
</svg>